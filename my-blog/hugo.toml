baseURL = 'https://your-site-name.netlify.app/'
languageCode = 'ja-jp'
title = '私の技術ブログ'
theme = 'ananke'
enableGitInfo = true
disableKinds = ["taxonomy", "term"]
enableRobotsTXT = true

[params]
  description = 'Hugoで作成した技術ブログです。プログラミング、開発、学習記録などを共有します。'
  author = 'ブログ管理者'
  github = 'your-github-username'
  twitter = 'your-twitter-username'
  showSummary = true
  showReadingTime = true
  mainSections = ["posts"]

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "投稿"
    url = "/posts/"
    weight = 10
  
  [[menu.main]]
    identifier = "categories"
    name = "カテゴリ"
    url = "/categories/"
    weight = 20
  
  [[menu.main]]
    identifier = "tags"
    name = "タグ"
    url = "/tags/"
    weight = 30

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser]
      wrapStandaloneLinksWithinParagraph = false

[outputs]
  home = ["HTML", "RSS"]

[outputFormats]
  [outputFormats.RSS]
    mediaType = "application/rss"
    baseName = "index"

[taxonomies]
  category = "categories"
  tag = "tags"
  series = "series"

[security]
  [security.exec]
    allow = ['^dart-sass-embedded$', '^go$', '^npx$', '^postcss$', '^babel$']

[server]
  [server.headers]
    [server.headers."/*"]
      X-Frame-Options = "DENY"
      X-Content-Type-Options = "nosniff"
      X-XSS-Protection = "1; mode=block"
